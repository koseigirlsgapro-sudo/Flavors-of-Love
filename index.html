        /* --------------------------------------------------
           AUDIO ENGINE (Tone.js / Web Audio API)
           -------------------------------------------------- */
        let audioEnabled = false;
        let bgmSynth = null;
        let seSynth = null;

        function initAudio() {
            if (audioEnabled) return;
            Tone.start();
            audioEnabled = true;

            seSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();

            bgmSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.3, release: 0.8 }
            }).toDestination();
            bgmSynth.volume.value = -12;

            startPopBGM();
        }

        function toggleAudio() {
            if (!audioEnabled) {
                initAudio();
                document.getElementById('audio-btn').innerHTML = '<i class="fa-solid fa-volume-high text-31pink"></i>';
            } else {
                Tone.Transport.stop();
                audioEnabled = false;
                document.getElementById('audio-btn').innerHTML = '<i class="fa-solid fa-volume-xmark text-gray-400"></i>';
            }
        }

        function playSE(type) {
            if (!audioEnabled || !seSynth) return;
            if (type === 'click') seSynth.triggerAttackRelease(["C5"], "8n");
            if (type === 'pop') seSynth.triggerAttackRelease(["E5", "G5"], "16n");
            if (type === 'heart') seSynth.triggerAttackRelease(["C5", "E5", "G5", "B5"], "16n");
            if (type === 'bad') seSynth.triggerAttackRelease(["C3", "C#3"], "8n");
        }

        function startPopBGM() {
            if (!audioEnabled) return;
            Tone.Transport.stop();
            Tone.Transport.cancel();

            const notes = ["C4", "E4", "G4", "B4", "C5", "G4", "E4", "G4"];
            let step = 0;

            Tone.Transport.scheduleRepeat((time) => {
                let note = notes[step % notes.length];
                bgmSynth.triggerAttackRelease(note, "8n", time);
                step++;
            }, "8n");

            Tone.Transport.bpm.value = 135;
            Tone.Transport.start();
        }

                    text: "「あら……ベタ、ですか……。皆様に愛される王道を守るのも大変なのですけれど……。」" },
                { next: "ichika_step2" }
            ],

            ichika_step2: [
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "normal" },
                    text: "「数日後――学園の温室で、苺華が摘みたての完熟イチゴを選別していた。」"
                },
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "happy" },
                    text: "「ふふ、このイチゴ、真っ赤でとっても美味しそうでしょう？……あ～ん、して差し上げましょうか？」",
                    choices: [
                        { text: "「えっ！？じゃあお言葉に甘えて……あ～ん！」", next: "ichika_2_good", affinity: { ichika: 15 } },
                        { text: "「お嬢様にそんなことをさせるなんて滅相もないです！」", next: "ichika_2_normal", affinity: { ichika: 5 } }
                    ]
                }
            ],
            ichika_2_good: [
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "happy" },
                    text: "「はい、あ～ん♪ ……ふふっ、美味しいですか？あなた様の幸せそうな顔が見られて、わたくしも胸がいっぱいです。」", sound: "heart" },
                { next: "ichika_step3" }
            ],
            ichika_2_normal: [
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "normal" },
                    text: "「まあ、ご謙虚ですのね。でもわたくし、あなた様にはもっと甘えていただきたいのですけれど……。」" },
                { next: "ichika_step3" }
            ],

            ichika_step3: [
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "normal" },
                    text: "「学園祭前夜。キャンドルが灯るサロンで、苺華とお互いの夢について語り合った。」"
                },
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "happy" },
                    text: "「わたくし、ずっと誰もが笑顔になれる『一等賞のストロベリーサンデー』を作るのが夢でした。でも今のわたくしの夢は……あなた様と一緒に歩む未来です。」",
                    choices: [
                        { text: "「僕も苺華さんとずっと甘い時間を過ごしたいです」", next: "ichika_3_good", affinity: { ichika: 20 } },
                        { text: "「素晴らしいストロベリーサンデーを明日作り上げましょう！」", next: "ichika_3_bad", affinity: { ichika: 0 } }
                    ]
                }
            ],
            ichika_3_good: [
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "happy" },
                    text: "「まあ……！ 夢が叶いましたわ！世界で一番甘酸っぱくて幸せな恋の始まりですわね♥」", sound: "heart" },
                { text: "苺華の気品あふれる笑みと温かい眼差しに、二人の心が完全に重なった。", next: "festival_prep" }
            ],
            ichika_3_bad: [
                {
                    speaker: "苺華",
                    char: { pos: "center", id: "ichika", expr: "normal" },
                    text: "「ええ、まずは明日の学園祭を成功させましょうね！」" },
                { text: "意気込みを新たに、学園祭当日へ向かうのだった。", next: "festival_prep" }
            ],

            // ==================================================
            // --- FESTIVAL PREP & FINALE ---
            // ==================================================
            festival_prep: [
                { speaker: "ナレーション", text: "そして迎えた『サーティワン大感謝学園祭』当日！学園最高のフレーバーを決めるコンテストが開幕した。" },
                {
                    speaker: "彩葉",
                    char: { pos: "center", id: "iroha", expr: "happy" },
                    text: "「さあ！私たちの試作フレーバーを披露するときだよ！」"
                },
                {
                    speaker: "ナレーション", text: "ここで最大の事件が発生！突然の雷雨で学園のメイン冷凍庫の電源がダウン！このままでは全生徒のアイスが溶けてしまう…！",
                    choices: [
                        { text: "【全員の力を合わせる】「ヒロイン達の特技を結集して氷を作ろう！」", next: "eval_ending", action: "unite" },
                        { text: "【一人で解決しようとする】「俺が自家発電機を回し続ける！」", next: "eval_ending", action: "solo" },
                        { text: "【パニックになって逃げ出す】「あわわわ！もうダメだ～逃げろ～！」", next: "eval_ending", action: "panic" }
                    ]
                }
            ]
        };

        /* --------------------------------------------------
           GAME STATE & ENGINE MANAGEMENT
           -------------------------------------------------- */
        let gameState = {
            currentScene: "start",
            sceneIndex: 0,
            affinity: { iroha: 0, aine: 0, choko: 0, ichika: 0 },
            logs: [],
            isAuto: false,
            isSkip: false,
            isTyping: false
        };

        let typingTimer = null;
        let autoTimer = null;

        function stopAutoAndSkip() {
            gameState.isAuto = false;
            gameState.isSkip = false;
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
            const autoBtn = document.getElementById('auto-btn');
            if (autoBtn) autoBtn.classList.remove('bg-31pink', 'text-white');
            const skipBtn = document.getElementById('skip-btn');
            if (skipBtn) skipBtn.classList.remove('bg-31blue', 'text-white');
        }

        function startGame() {
            initAudio();
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('choices-container').classList.add('hidden');
            stopAutoAndSkip();
            gameState = {
                currentScene: "start",
                sceneIndex: 0,
                affinity: { iroha: 0, aine: 0, choko: 0, ichika: 0 },
                logs: [],
                isAuto: false,
                isSkip: false,
                isTyping: false
            };
            renderScene();
        }

        function renderScene() {
            const lines = SCENARIO[gameState.currentScene];
            if (!lines || gameState.sceneIndex < 0 || gameState.sceneIndex >= lines.length) {
                return;
            }

            const line = lines[gameState.sceneIndex];
            if (!line) return;

            // Sound
            if (line.sound) playSE(line.sound);

            // Background
            if (line.bg) {
                document.getElementById('bg-layer').className = `absolute inset-0 bg-cover bg-center transition-all duration-700 ${line.bg}`;
            }

            // Character Display
            const leftEl = document.getElementById('char-left');
            const centerEl = document.getElementById('char-center');
            const rightEl = document.getElementById('char-right');

            leftEl.innerHTML = ''; centerEl.innerHTML = ''; rightEl.innerHTML = '';
            leftEl.classList.add('opacity-0'); centerEl.classList.add('opacity-0'); rightEl.classList.add('opacity-0');

            if (line.char) {
                const charData = CHARACTERS[line.char.id];
                const svgHtml = charData ? charData.getSvg(line.char.expr) : '';
                let targetEl = centerEl;
                if (line.char.pos === 'left') targetEl = leftEl;
                if (line.char.pos === 'right') targetEl = rightEl;

                targetEl.innerHTML = svgHtml;
                targetEl.classList.remove('opacity-0');
            }

            // Speaker Tag
            const speakerTag = document.getElementById('speaker-tag');
            const speakerName = document.getElementById('speaker-name');
            speakerName.innerText = line.speaker || "？？？";

            if (line.speaker === "主人公" || line.speaker === "ナレーション") {
                speakerTag.classList.remove('from-31pink', 'to-pink-500');
                speakerTag.classList.add('from-31blue', 'to-cyan-600');
            } else {
                speakerTag.classList.remove('from-31blue', 'to-cyan-600');
                speakerTag.classList.add('from-31pink', 'to-pink-500');
            }

            // Dialogue Text Typing
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.classList.add('hidden');

            // Log
            if (line.text) {
                gameState.logs.push(`${line.speaker || 'ナレーション'}: ${line.text}`);
            }

            typeWriter(line.text || '', () => {
                if (line.choices) {
                    stopAutoAndSkip();
                    showChoices(line.choices);
                } else if (gameState.isAuto || gameState.isSkip) {
                    const delay = gameState.isSkip ? 150 : 1800;
                    autoTimer = setTimeout(() => {
                        nextDialogue();
                    }, delay);
                }
            });
        }

        function typeWriter(text, callback) {
            const textEl = document.getElementById('dialogue-text');
            textEl.innerHTML = '';
            let i = 0;
            gameState.isTyping = true;
            clearInterval(typingTimer);

            const speed = gameState.isSkip ? 5 : 30;

            typingTimer = setInterval(() => {
                if (i < text.length) {
                    textEl.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingTimer);
                    gameState.isTyping = false;
                    if (callback) callback();
                }
            }, speed);
        }

        function handleDialogueClick() {
            if (!document.getElementById('choices-container').classList.contains('hidden') ||
                !document.getElementById('ending-screen').classList.contains('hidden') ||
                !document.getElementById('saveload-modal').classList.contains('hidden') ||
                !document.getElementById('log-modal').classList.contains('hidden') ||
                !document.getElementById('affection-modal').classList.contains('hidden')) {
                return;
            }

            const lines = SCENARIO[gameState.currentScene];
            if (!lines || gameState.sceneIndex >= lines.length) {
                return;
            }

            if (gameState.isTyping) {
                clearInterval(typingTimer);
                const line = lines[gameState.sceneIndex];
                if (line) {
                    document.getElementById('dialogue-text').innerHTML = line.text || '';
                    gameState.isTyping = false;
                    if (line.choices) {
                        stopAutoAndSkip();
                        showChoices(line.choices);
                    } else if (gameState.isAuto || gameState.isSkip) {
                        const delay = gameState.isSkip ? 150 : 1800;
                        autoTimer = setTimeout(() => {
                            nextDialogue();
                        }, delay);
                    }
                }
            } else {
                nextDialogue();
            }
        }

        function nextDialogue() {
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }

            const lines = SCENARIO[gameState.currentScene];
            if (!lines || gameState.sceneIndex >= lines.length) {
                if (gameState.currentScene === "eval_ending") {
                    evaluateEnding();
                }
                return;
            }

            const line = lines[gameState.sceneIndex];
            if (!line) return;

            if (line.choices && !document.getElementById('choices-container').classList.contains('hidden')) {
                return;
            }

            if (line.next) {
                if (line.next === "eval_ending") {
                    evaluateEnding();
                    return;
                }
                gameState.currentScene = line.next;
                gameState.sceneIndex = 0;
            } else {
                gameState.sceneIndex++;
            }

            if (gameState.currentScene === "eval_ending") {
                evaluateEnding();
                return;
            }

            const currentLines = SCENARIO[gameState.currentScene];
            if (currentLines && gameState.sceneIndex < currentLines.length) {
                renderScene();
            } else if (currentLines && gameState.sceneIndex >= currentLines.length) {
                if (gameState.currentScene === "eval_ending") {
                    evaluateEnding();
                }
            }
        }

        function showChoices(choices) {
            const container = document.getElementById('choices-container');
            const buttonsBox = document.getElementById('choice-buttons');
            buttonsBox.innerHTML = '';

            choices.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = "btn-31 w-full py-3 px-6 text-white font-bold text-base sm:text-lg rounded-2xl text-left border-2 border-white transform hover:scale-102 transition shadow-lg";
                btn.innerText = c.text;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    playSE('pop');
                    spawnParticles();
                    if (c.affinity) {
                        for (let k in c.affinity) {
                            gameState.affinity[k] = (gameState.affinity[k] || 0) + c.affinity[k];
                        }
                    }
                    container.classList.add('hidden');
                    if (c.action === 'panic') {
                        triggerEnding('bad');
                        return;
                    }
                    if (c.next) {
                        if (c.next === "eval_ending") {
                            evaluateEnding();
                            return;
                        }
                        gameState.currentScene = c.next;
                        gameState.sceneIndex = 0;
                        renderScene();
                    } else {
                        gameState.sceneIndex++;
                        renderScene();
                    }
                };
                buttonsBox.appendChild(btn);
            });

            container.classList.remove('hidden');
        }

        /* --------------------------------------------------
           ENDING EVALUATION SYSTEM
           -------------------------------------------------- */
        function evaluateEnding() {
            stopAutoAndSkip();
            const aff = gameState.affinity;
            const maxAffinity = Math.max(aff.iroha, aff.aine, aff.choko, aff.ichika);
            const totalAffinity = aff.iroha + aff.aine + aff.choko + aff.ichika;

            if (totalAffinity >= 65) {
                triggerEnding('best');
            } else if (maxAffinity >= 40) {
                let heroName = "彩葉";
                if (maxAffinity === aff.aine) heroName = "愛音";
                if (maxAffinity === aff.choko) heroName = "巧可";
                if (maxAffinity === aff.ichika) heroName = "苺華";
                triggerEnding('happy', heroName);
            } else {
                triggerEnding('normal');
            }
        }

        function triggerEnding(type, heroineName = "") {
            const modal = document.getElementById('ending-screen');
            const badge = document.getElementById('ending-badge');
            const title = document.getElementById('ending-title');
            const desc = document.getElementById('ending-desc');
            const icon = document.getElementById('ending-illustration');

            modal.classList.remove('hidden');

            if (type === 'best') {
                badge.className = "px-4 py-1 bg-yellow-400 text-gray-900 font-black rounded-full text-xs sm:text-sm mb-3";
                badge.innerText = "★ BEST ENDING ★";
                title.innerText = "サーティワン・オールスターズ！";
                icon.innerHTML = '<i class="fa-solid fa-crown text-yellow-300"></i>';
                desc.innerText = "ヒロイン全員との強い絆で見事なハーモニーを生み出し、伝説の限定フレーバー『サーティワン・ラブ・シャワー』が完成！学園祭は大盛況となり、正体がバレてもあなたは学園の『名誉アイスマスター』としてみんなから永久に愛されることになりました！";
                playSE('heart');
            } else if (type === 'happy') {
                badge.className = "px-4 py-1 bg-31pink text-white font-black rounded-full text-xs sm:text-sm mb-3";
                badge.innerText = "♥ HAPPY ENDING ♥";
                title.innerText = `${heroineName}と紡ぐ甘い誓い`;
                icon.innerHTML = '<i class="fa-solid fa-heart text-31pink"></i>';
                desc.innerText = `数々の危機を共に乗り越えた学園祭の後、夕暮れの校舎裏で${heroineName}から胸キュン必至の告白を受けました！「これからはずっと、私だけの特別なフレーバーでいてね……♥」`;
                playSE('heart');
            } else if (type === 'normal') {
                badge.className = "px-4 py-1 bg-31blue text-white font-black rounded-full text-xs sm:text-sm mb-3";
                badge.innerText = "♪ NORMAL ENDING ♪";
                title.innerText = "平和で美味しい学園生活";
                icon.innerHTML = '<i class="fa-solid fa-ice-cream text-31blue"></i>';
                desc.innerText = "学園祭は無事に終了。特別な深い恋には発展しなかったものの、あなたは優秀な研究員として甘く賑やかな学園生活をこれからも続けていくのでした。";
                playSE('click');
            } else if (type === 'bad') {
                badge.className = "px-4 py-1 bg-purple-600 text-white font-black rounded-full text-xs sm:text-sm mb-3";
                badge.innerText = "✖ BAD ENDING ✖";
                title.innerText = "パニック＆溶けたアイスの惨劇";
                icon.innerHTML = '<i class="fa-solid fa-skull-crossbones text-purple-400"></i>';
                desc.innerText = "パニックになって逃げ出したあなたの正体が男子生徒だと即バレ！激怒した風紀委員長と学園の乙女たちによって『極寒トリプルスクープの刑』に処され、即日退学となってしまいました……。";
                playSE('bad');
            }
        }

        function returnToTitle() {
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        /* --------------------------------------------------
           PARTICLE EFFECTS & CONTROLS
           -------------------------------------------------- */
        function spawnParticles() {
            const container = document.getElementById('particle-layer');
            const colors = ['#ff4d8d', '#00b2e3', '#a2e8dd', '#ffe66d', '#ff70a6'];

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'pop-particle';
                const size = Math.random() * 16 + 8;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.borderRadius = '50%';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;

                container.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        function toggleAuto() {
            gameState.isAuto = !gameState.isAuto;
            const btn = document.getElementById('auto-btn');
            if (gameState.isAuto) {
                btn.classList.add('bg-31pink', 'text-white');
                nextDialogue();
            } else {
                btn.classList.remove('bg-31pink', 'text-white');
            }
        }

        function toggleSkip() {
            gameState.isSkip = !gameState.isSkip;
            const btn = document.getElementById('skip-btn');
            if (gameState.isSkip) {
                btn.classList.add('bg-31blue', 'text-white');
                nextDialogue();
            } else {
                btn.classList.remove('bg-31blue', 'text-white');
            }
        }

        /* --------------------------------------------------
           MODAL LOGIC
           -------------------------------------------------- */
        function toggleAffectionModal() {
            const modal = document.getElementById('affection-modal');
            const list = document.getElementById('affection-list');

            if (modal.classList.contains('hidden')) {
                list.innerHTML = '';
                for (let k in CHARACTERS) {
                    const char = CHARACTERS[k];
                    const val = gameState.affinity[k] || 0;
                    const item = document.createElement('div');
                    item.className = "flex items-center gap-3 p-3 bg-pink-50 rounded-2xl border border-pink-200";
                    item.innerHTML = `
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style="background-color: ${char.color}">
                            <i class="fa-solid ${char.icon}"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between font-bold text-sm">
                                <span>${char.name}</span>
                                <span style="color: ${char.color}">${val} pt</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3 mt-1 overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-500" style="width: ${Math.min(val * 2, 100)}%; background-color: ${char.color}"></div>
                            </div>
                        </div>
                    `;
                    list.appendChild(item);
                }
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function openLogModal() {
            const modal = document.getElementById('log-modal');
            const content = document.getElementById('log-content');
            content.innerHTML = '';
            gameState.logs.forEach(line => {
                const p = document.createElement('p');
                p.className = "p-2 bg-gray-50 rounded-lg border border-gray-100 text-gray-700";
                p.innerText = line;
                content.appendChild(p);
            });
            content.scrollTop = content.scrollHeight;
            modal.classList.remove('hidden');
        }

        function closeLogModal() {
            document.getElementById('log-modal').classList.add('hidden');
        }

        function openSaveModal(isLoadOnly = false) {
            const modal = document.getElementById('saveload-modal');
            const slotsContainer = document.getElementById('save-slots');
            document.getElementById('saveload-title').innerText = isLoadOnly ? "ロード" : "セーブ / ロード";
            slotsContainer.innerHTML = '';

            for (let i = 1; i <= 3; i++) {
                const key = `31love_save_${i}`;
                const savedData = localStorage.getItem(key);
                const slot = document.createElement('div');
                slot.className = "flex items-center justify-between p-3 bg-purple-50 rounded-2xl border border-purple-200 text-sm font-bold";

                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    slot.innerHTML = `
                        <div>
                            <span class="text-31purple font-black">SLOT ${i}</span>
                            <span class="text-xs text-gray-500 ml-2">${parsed.date}</span>
                            <div class="text-xs text-gray-700 truncate max-w-[200px]">${parsed.scene}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="loadGame(${i})" class="px-3 py-1 bg-31blue text-white rounded-lg text-xs shadow">ロード</button>
                            ${!isLoadOnly ? `<button onclick="saveGame(${i})" class="px-3 py-1 bg-31pink text-white rounded-lg text-xs shadow">上書き</button>` : ''}
                        </div>
                    `;
                } else {
                    slot.innerHTML = `
                        <span class="text-gray-400">SLOT ${i} - NO DATA</span>
                        <div>
                            ${!isLoadOnly ? `<button onclick="saveGame(${i})" class="px-3 py-1 bg-31pink text-white rounded-lg text-xs shadow">セーブ</button>` : ''}
                        </div>
                    `;
                }
                slotsContainer.appendChild(slot);
            }
            modal.classList.remove('hidden');
        }

        function closeSaveModal() {
            document.getElementById('saveload-modal').classList.add('hidden');
        }

        function saveGame(slot) {
            const data = {
                date: new Date().toLocaleString(),
                scene: gameState.currentScene,
                sceneIndex: gameState.sceneIndex,
                affinity: gameState.affinity,
                logs: gameState.logs
            };
            localStorage.setItem(`31love_save_${slot}`, JSON.stringify(data));
            playSE('click');
            openSaveModal();
        }

        function loadGame(slot) {
            const saved = localStorage.getItem(`31love_save_${slot}`);
            if (saved) {
                const parsed = JSON.parse(saved);
                gameState.currentScene = parsed.scene;
                gameState.sceneIndex = parsed.sceneIndex;
                gameState.affinity = parsed.affinity;
                gameState.logs = parsed.logs || [];
                closeSaveModal();
                document.getElementById('title-screen').classList.add('hidden');
                renderScene();
                playSE('click');
            }
        }
    </script>
